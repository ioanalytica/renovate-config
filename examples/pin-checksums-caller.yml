# .github/workflows/pin-checksums.yml of a repository that uses the table.
name: Pin checksums

on:
  pull_request:

permissions: {}

jobs:
  pin-checksums:
    if: startsWith(github.head_ref, 'renovate/')
    # Pin the commit of a release of ioanalytica/renovate-config; Renovate
    # moves it like any other action.
    uses: ioanalytica/renovate-config/.github/workflows/pin-checksums.yml@<commit-sha> # v1.0.0
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    secrets:
      RENOVATE_HELPER_APP_ID: ${{ secrets.RENOVATE_HELPER_APP_ID }}
      RENOVATE_HELPER_PRIVATE_KEY: ${{ secrets.RENOVATE_HELPER_PRIVATE_KEY }}
